<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Labeling Memory Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fff6e5;
        --bg-2: #ffe9f3;
        --ink: #3a2a4d;
        --ink-soft: #6b5a86;
        --chip-bg: #ffffff;
        --chip-shadow: rgba(58, 42, 77, 0.14);
        --card-back-1: #ff8fab;
        --card-back-2: #ff6b9d;
        --card-face: #ffffff;
        --card-border: #ffd166;
        --matched-ring: #2ec4b6;
        --btn-primary: #ff6b9d;
        --btn-primary-dark: #e14e83;
        --btn-say: #4dabf7;
        --btn-say-dark: #2f8fe0;
        --btn-done: #2ec4b6;
        --btn-done-dark: #1da596;
        --overlay: rgba(58, 42, 77, 0.45);
        --panel: #ffffff;
        --toast-bg: #3a2a4d;
        --toast-ink: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241b33;
          --bg-2: #2e2140;
          --ink: #fdf6ff;
          --ink-soft: #c9b8e0;
          --chip-bg: #3a2c55;
          --chip-shadow: rgba(0, 0, 0, 0.35);
          --card-face: #3a2c55;
          --card-border: #ffb703;
          --panel: #322747;
          --overlay: rgba(10, 6, 20, 0.6);
          --toast-bg: #fdf6ff;
          --toast-ink: #3a2a4d;
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Fredoka", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, var(--bg-2) 0, transparent 45%),
          radial-gradient(circle at 88% 90%, #d8f7ff 0, transparent 45%),
          var(--bg);
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
        user-select: none;
        -webkit-user-select: none;
      }

      /* ---------- Score bar ---------- */
      .scorebar {
        width: 100%;
        max-width: 560px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .chip {
        background: var(--chip-bg);
        border-radius: 999px;
        padding: 10px 20px;
        font-size: clamp(1.05rem, 4.5vw, 1.35rem);
        font-weight: 600;
        box-shadow: 0 4px 0 var(--chip-shadow), 0 8px 18px var(--chip-shadow);
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 52px;
      }
      .chip .num { font-weight: 700; font-size: 1.15em; }
      .chip.score-chip { color: #e8871e; }
      @media (prefers-color-scheme: dark) { .chip.score-chip { color: #ffd166; } }
      .chip.pop { animation: chipPop 0.35s ease; }
      @keyframes chipPop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }

      .sound-btn {
        border: none;
        cursor: pointer;
        background: var(--chip-bg);
        border-radius: 999px;
        width: 52px; height: 52px;
        font-size: 1.4rem;
        box-shadow: 0 4px 0 var(--chip-shadow), 0 8px 18px var(--chip-shadow);
        display: flex; align-items: center; justify-content: center;
      }
      .sound-btn:active { transform: translateY(2px); }

      .hint {
        font-size: clamp(1rem, 4vw, 1.2rem);
        font-weight: 500;
        color: var(--ink-soft);
        margin: 0 0 14px;
        text-align: center;
        min-height: 1.5em;
      }

      /* ---------- Grid ---------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(8px, 2.4vw, 14px);
        width: 100%;
        max-width: 560px;
      }
      .card {
        aspect-ratio: 1 / 1;
        perspective: 700px;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
      }
      .card-inner {
        display: block;
        position: relative;
        width: 100%; height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
      }
      .card.flipped .card-inner { transform: rotateY(180deg); }
      .card-face {
        position: absolute; inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: clamp(14px, 4vw, 22px);
        display: flex; align-items: center; justify-content: center;
      }
      .card-back {
        background: linear-gradient(145deg, var(--card-back-1), var(--card-back-2));
        box-shadow: 0 5px 0 rgba(0,0,0,0.12), inset 0 0 0 4px rgba(255,255,255,0.35);
        font-size: clamp(1.8rem, 9vw, 3rem);
        color: #fff;
        font-weight: 700;
        text-shadow: 0 2px 0 rgba(0,0,0,0.15);
      }
      .card:nth-child(4n+2) .card-back { background: linear-gradient(145deg, #4dabf7, #3b8ef0); }
      .card:nth-child(4n+3) .card-back { background: linear-gradient(145deg, #51cf66, #2fb84d); }
      .card:nth-child(4n+4) .card-back { background: linear-gradient(145deg, #ffa94d, #ff922b); }
      .card:nth-child(4n+1) .card-back { background: linear-gradient(145deg, #b197fc, #9775fa); }
      .card-front {
        background: var(--card-face);
        transform: rotateY(180deg);
        border: 4px solid var(--card-border);
        box-shadow: 0 5px 0 rgba(0,0,0,0.08);
        font-size: clamp(2.4rem, 13vw, 4.2rem);
        line-height: 1;
      }
      .card.matched { cursor: default; }
      .card.matched .card-front {
        border-color: var(--matched-ring);
        box-shadow: 0 0 0 4px var(--matched-ring), 0 8px 20px rgba(46, 196, 182, 0.35);
        animation: matchBounce 0.5s ease;
      }
      @keyframes matchBounce {
        0% { transform: rotateY(180deg) scale(1); }
        40% { transform: rotateY(180deg) scale(1.12); }
        100% { transform: rotateY(180deg) scale(1); }
      }
      .card:not(.flipped):active .card-inner { transform: scale(0.94); }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed;
        left: 50%; bottom: max(26px, env(safe-area-inset-bottom));
        transform: translate(-50%, 90px);
        background: var(--toast-bg);
        color: var(--toast-ink);
        font-weight: 600;
        font-size: clamp(1.1rem, 4.5vw, 1.4rem);
        padding: 14px 28px;
        border-radius: 999px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
        z-index: 40;
        pointer-events: none;
        white-space: nowrap;
      }
      .toast.show { transform: translate(-50%, 0); }

      /* ---------- Labeling panel ---------- */
      .overlay {
        position: fixed; inset: 0;
        background: var(--overlay);
        display: none;
        align-items: center; justify-content: center;
        padding: 18px;
        z-index: 50;
      }
      .overlay.open { display: flex; }
      .panel {
        background: var(--panel);
        border-radius: 30px;
        padding: 26px 22px 24px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0,0,0,0.3);
        animation: panelIn 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      @keyframes panelIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .panel .big-pic {
        font-size: clamp(6rem, 34vw, 9.5rem);
        line-height: 1.1;
        display: block;
        animation: picWiggle 1.6s ease-in-out infinite;
      }
      @keyframes picWiggle {
        0%, 100% { transform: rotate(-3deg) scale(1); }
        50% { transform: rotate(3deg) scale(1.05); }
      }
      .panel h2 {
        margin: 6px 0 4px;
        font-size: clamp(1.7rem, 7vw, 2.2rem);
        font-weight: 700;
      }
      .panel .word-reveal {
        min-height: 1.6em;
        font-size: clamp(1.25rem, 5.5vw, 1.6rem);
        font-weight: 600;
        color: var(--matched-ring);
        margin: 2px 0 14px;
      }
      @media (prefers-color-scheme: dark) { .panel .word-reveal { color: #63e6d8; } }
      .big-btn {
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        color: #fff;
        border-radius: 999px;
        width: 100%;
        min-height: 68px;
        font-size: clamp(1.3rem, 6vw, 1.7rem);
        padding: 14px 20px;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .big-btn:active { transform: translateY(3px); }
      .btn-say { background: var(--btn-say); box-shadow: 0 6px 0 var(--btn-say-dark); }
      .btn-say:active { box-shadow: 0 2px 0 var(--btn-say-dark); }
      .btn-done { background: var(--btn-done); box-shadow: 0 6px 0 var(--btn-done-dark); }
      .btn-done:active { box-shadow: 0 2px 0 var(--btn-done-dark); }
      .btn-again { background: var(--btn-primary); box-shadow: 0 6px 0 var(--btn-primary-dark); }
      .btn-again:active { box-shadow: 0 2px 0 var(--btn-primary-dark); }
      .hidden { display: none !important; }

      /* ---------- Win panel ---------- */
      .stars {
        font-size: clamp(2.6rem, 12vw, 3.6rem);
        letter-spacing: 6px;
        margin: 4px 0 6px;
        line-height: 1.2;
      }
      .stars .star { display: inline-block; opacity: 0.18; filter: grayscale(1); transform: scale(0.7); }
      .stars .star.lit { opacity: 1; filter: none; animation: starPop 0.5s cubic-bezier(0.34, 1.6, 0.64, 1) both; }
      @keyframes starPop { from { transform: scale(0); } to { transform: scale(1.15); } }
      .win-score {
        font-size: clamp(1.3rem, 6vw, 1.7rem);
        font-weight: 600;
        margin: 4px 0 20px;
      }
      .win-score .num { font-size: 1.3em; font-weight: 700; color: #e8871e; }
      @media (prefers-color-scheme: dark) { .win-score .num { color: #ffd166; } }

      .new-game-row { margin-top: 18px; }
      .new-game-btn {
        border: none; cursor: pointer;
        font-family: inherit;
        background: var(--chip-bg);
        color: var(--ink);
        font-weight: 600;
        font-size: 1.05rem;
        border-radius: 999px;
        padding: 12px 26px;
        min-height: 52px;
        box-shadow: 0 4px 0 var(--chip-shadow), 0 8px 18px var(--chip-shadow);
      }
      .new-game-btn:active { transform: translateY(2px); }

      #confetti-canvas {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 60;
      }
      @media (prefers-reduced-motion: reduce) {
        .card-inner, .panel, .panel .big-pic { animation: none !important; transition: none !important; }
      }
    </style>
      <link rel="apple-touch-icon" href="/labeling-memory-match/apple-touch-icon.png">
</head>
  <body>
    <div class="scorebar" role="status" aria-live="polite">
      <div class="chip" id="match-chip">⭐ Matches&nbsp;<span class="num" id="match-count">0/8</span></div>
      <div class="chip score-chip" id="score-chip">🏆 Score&nbsp;<span class="num" id="score-count">0</span></div>
      <button class="sound-btn" id="sound-btn" aria-label="Turn sound off">🔊</button>
    </div>

    <p class="hint" id="hint">Tap a card to flip it! 👇</p>

    <div class="grid" id="grid" role="group" aria-label="Memory cards"></div>

    <div class="new-game-row">
      <button class="new-game-btn" id="new-game-btn">🔀 New Game</button>
    </div>

    <div class="toast" id="toast" aria-hidden="true"></div>

    <!-- Labeling panel: appears on every flip -->
    <div class="overlay" id="label-overlay">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="label-q">
        <span class="big-pic" id="label-pic">🐶</span>
        <h2 id="label-q">What is it? 🤔</h2>
        <div class="word-reveal" id="word-reveal">&nbsp;</div>
        <button class="big-btn btn-say" id="say-btn">🎤 Say it!</button>
        <button class="big-btn btn-done hidden" id="said-btn">⭐ I said it!</button>
      </div>
    </div>

    <!-- Win panel -->
    <div class="overlay" id="win-overlay">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title">
        <span class="big-pic">🎉</span>
        <h2 id="win-title">You did it!</h2>
        <div class="stars" id="stars" aria-label="Stars earned">
          <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
        </div>
        <p class="win-score">You found all 8 pairs!<br />Total score: <span class="num" id="final-score">0</span></p>
        <button class="big-btn btn-again" id="play-again-btn">▶️ Play Again</button>
      </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
      (function () {
        "use strict";

        // Common labeling targets: animals, foods, everyday objects.
        var POOL = [
          { emoji: "🐶", word: "dog" },
          { emoji: "🐱", word: "cat" },
          { emoji: "🐸", word: "frog" },
          { emoji: "🦁", word: "lion" },
          { emoji: "🐷", word: "pig" },
          { emoji: "🐠", word: "fish" },
          { emoji: "🦋", word: "butterfly" },
          { emoji: "🐢", word: "turtle" },
          { emoji: "🍎", word: "apple" },
          { emoji: "🍌", word: "banana" },
          { emoji: "🍕", word: "pizza" },
          { emoji: "🍓", word: "strawberry" },
          { emoji: "🍦", word: "ice cream" },
          { emoji: "🚗", word: "car" },
          { emoji: "🚌", word: "bus" },
          { emoji: "🎈", word: "balloon" },
          { emoji: "⚽", word: "ball" },
          { emoji: "🧸", word: "teddy bear" },
          { emoji: "✈️", word: "airplane" },
          { emoji: "🌻", word: "flower" }
        ];
        var PAIRS = 8;
        var MATCH_POINTS = 100;

        var grid = document.getElementById("grid");
        var hint = document.getElementById("hint");
        var matchCountEl = document.getElementById("match-count");
        var scoreCountEl = document.getElementById("score-count");
        var matchChip = document.getElementById("match-chip");
        var scoreChip = document.getElementById("score-chip");
        var toast = document.getElementById("toast");

        var labelOverlay = document.getElementById("label-overlay");
        var labelPic = document.getElementById("label-pic");
        var wordReveal = document.getElementById("word-reveal");
        var sayBtn = document.getElementById("say-btn");
        var saidBtn = document.getElementById("said-btn");

        var winOverlay = document.getElementById("win-overlay");
        var finalScoreEl = document.getElementById("final-score");
        var starsEl = document.getElementById("stars");

        var deck = [];        // shuffled card data
        var firstPick = null; // index of first flipped card awaiting a partner
        var pendingCard = null; // card whose labeling panel is open
        var busy = false;     // lock input during panel / compare
        var matches = 0;
        var score = 0;
        var turns = 0;        // completed two-card turns (for stars)

        /* ---------- Sound (gentle WebAudio pops, no files) ---------- */
        var soundOn = true;
        var audioCtx = null;
        function tone(freq, dur, type, vol, when) {
          if (!soundOn) return;
          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
            var t = audioCtx.currentTime + (when || 0);
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol || 0.12, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + dur + 0.05);
          } catch (e) { /* sound is a bonus, never block play */ }
        }
        function popSound() { tone(520, 0.12, "sine", 0.1); tone(760, 0.1, "sine", 0.07, 0.04); }
        function matchSound() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, "triangle", 0.12, i * 0.09); }); }
        function gentleSound() { tone(392, 0.18, "sine", 0.08); tone(330, 0.22, "sine", 0.08, 0.12); }
        function winSound() { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.3, "triangle", 0.12, i * 0.13); }); }

        document.getElementById("sound-btn").addEventListener("click", function () {
          soundOn = !soundOn;
          this.textContent = soundOn ? "🔊" : "🔇";
          this.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
          if (soundOn) popSound();
        });

        /* ---------- Confetti (hand-rolled canvas) ---------- */
        var canvas = document.getElementById("confetti-canvas");
        var ctx = canvas.getContext("2d");
        var pieces = [];
        var confettiRunning = false;
        var CONFETTI_COLORS = ["#ff6b9d", "#ffd166", "#4dabf7", "#51cf66", "#b197fc", "#ffa94d", "#2ec4b6"];
        function sizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener("resize", sizeCanvas);
        sizeCanvas();
        function burstConfetti(count, spread) {
          for (var i = 0; i < count; i++) {
            pieces.push({
              x: window.innerWidth / 2 + (Math.random() - 0.5) * (spread || window.innerWidth * 0.6),
              y: window.innerHeight * 0.35 + (Math.random() - 0.5) * 60,
              w: 7 + Math.random() * 8,
              h: 10 + Math.random() * 10,
              color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
              vx: (Math.random() - 0.5) * 7,
              vy: -(4 + Math.random() * 7),
              rot: Math.random() * Math.PI * 2,
              vr: (Math.random() - 0.5) * 0.3,
              life: 90 + Math.random() * 60
            });
          }
          if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiTick); }
        }
        function confettiTick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          pieces = pieces.filter(function (p) { return p.life > 0; });
          pieces.forEach(function (p) {
            p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.vx *= 0.99;
            p.rot += p.vr; p.life--;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = Math.min(1, p.life / 40);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });
          if (pieces.length) { requestAnimationFrame(confettiTick); }
          else { confettiRunning = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
        }

        /* ---------- Helpers ---------- */
        var toastTimer = null;
        function showToast(msg, ms) {
          toast.textContent = msg;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toast.classList.remove("show"); }, ms || 1600);
        }
        function shuffle(arr) {
          var a = arr.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }
        function popChip(el) {
          el.classList.remove("pop");
          void el.offsetWidth;
          el.classList.add("pop");
        }

        /* ---------- Game setup ---------- */
        function newGame() {
          var chosen = shuffle(POOL).slice(0, PAIRS);
          deck = shuffle(chosen.concat(chosen).map(function (item, i) {
            return { emoji: item.emoji, word: item.word, id: i };
          }));
          firstPick = null;
          pendingCard = null;
          busy = false;
          matches = 0;
          score = 0;
          turns = 0;
          matchCountEl.textContent = "0/" + PAIRS;
          scoreCountEl.textContent = "0";
          hint.textContent = "Tap a card to flip it! 👇";
          labelOverlay.classList.remove("open");
          winOverlay.classList.remove("open");

          grid.innerHTML = "";
          deck.forEach(function (card, idx) {
            var btn = document.createElement("button");
            btn.className = "card";
            btn.setAttribute("aria-label", "Mystery card " + (idx + 1));
            btn.innerHTML =
              '<span class="card-inner">' +
                '<span class="card-face card-back">?</span>' +
                '<span class="card-face card-front">' + card.emoji + "</span>" +
              "</span>";
            btn.addEventListener("click", function () { onCardTap(idx, btn); });
            grid.appendChild(btn);
          });
        }

        function onCardTap(idx, btn) {
          if (busy) return;
          if (btn.classList.contains("flipped")) return; // already showing
          busy = true;
          btn.classList.add("flipped");
          btn.setAttribute("aria-label", deck[idx].word);
          popSound();
          pendingCard = { idx: idx, btn: btn };
          // Show the labeling panel for every flip.
          setTimeout(openLabelPanel, 260);
        }

        function openLabelPanel() {
          var card = deck[pendingCard.idx];
          labelPic.textContent = card.emoji;
          wordReveal.innerHTML = "&nbsp;";
          sayBtn.classList.remove("hidden");
          saidBtn.classList.add("hidden");
          labelOverlay.classList.add("open");
        }

        sayBtn.addEventListener("click", function () {
          // The adult models / the child repeats: reveal the word as a cheer.
          var card = deck[pendingCard.idx];
          var article = /^[aeiou]/i.test(card.word) ? "an" : "a";
          wordReveal.textContent = "It's " + article + " " + card.word + "! 🎉";
          popSound();
          sayBtn.classList.add("hidden");
          saidBtn.classList.remove("hidden");
          saidBtn.focus();
        });

        saidBtn.addEventListener("click", function () {
          labelOverlay.classList.remove("open");
          var card = pendingCard;
          pendingCard = null;
          if (firstPick === null) {
            firstPick = card;
            hint.textContent = "Great! Now find its match! 🔍";
            busy = false;
          } else {
            turns++;
            var a = firstPick, b = card;
            firstPick = null;
            setTimeout(function () { resolveTurn(a, b); }, 350);
          }
        });

        function resolveTurn(a, b) {
          if (deck[a.idx].emoji === deck[b.idx].emoji) {
            a.btn.classList.add("matched");
            b.btn.classList.add("matched");
            a.btn.disabled = true;
            b.btn.disabled = true;
            matches++;
            score += MATCH_POINTS;
            matchCountEl.textContent = matches + "/" + PAIRS;
            scoreCountEl.textContent = score;
            popChip(matchChip); popChip(scoreChip);
            matchSound();
            burstConfetti(70);
            showToast("🎉 It's a match! +" + MATCH_POINTS + " points!");
            hint.textContent = matches === PAIRS ? "You found them all!" : "Super matching! Keep going! 🌟";
            busy = false;
            if (matches === PAIRS) {
              setTimeout(showWin, 900);
            }
          } else {
            gentleSound();
            showToast("💪 Good try! Try again!");
            hint.textContent = "Almost! Remember where they are! 🧠";
            setTimeout(function () {
              a.btn.classList.remove("flipped");
              b.btn.classList.remove("flipped");
              a.btn.setAttribute("aria-label", "Mystery card");
              b.btn.setAttribute("aria-label", "Mystery card");
              busy = false;
            }, 700);
          }
        }

        function starCount() {
          // Generous stars: every finished game earns them; fewer turns = more.
          if (turns <= 12) return 3;
          if (turns <= 20) return 2;
          return 1;
        }

        function showWin() {
          finalScoreEl.textContent = score;
          var stars = starsEl.querySelectorAll(".star");
          var lit = starCount();
          stars.forEach(function (s, i) {
            s.classList.remove("lit");
            if (i < lit) {
              s.style.animationDelay = (0.25 * i + 0.2) + "s";
              void s.offsetWidth;
              s.classList.add("lit");
            }
          });
          winOverlay.classList.add("open");
          winSound();
          burstConfetti(130, window.innerWidth * 0.9);
          setTimeout(function () { burstConfetti(90, window.innerWidth * 0.7); }, 350);
        }

        document.getElementById("play-again-btn").addEventListener("click", function () {
          popSound();
          newGame();
        });
        document.getElementById("new-game-btn").addEventListener("click", function () {
          popSound();
          newGame();
          showToast("🔀 New game! Find the pairs!");
        });

        newGame();
      })();
    </script>
  </body>
</html>
